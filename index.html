<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Orpita Das | Data Science & AI Developer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  
  <!-- Background Layers -->
  <div id="bg-layers" aria-hidden="true">
    <div class="bg-layer layer-grid"></div>
    <div class="bg-layer layer-blobs">
      <div class="blob-wrapper blob-wrapper-1">
        <div class="blob blob-1"></div>
      </div>
      <div class="blob-wrapper blob-wrapper-2">
        <div class="blob blob-2"></div>
      </div>
    </div>
    <div class="bg-layer layer-noise"></div>
  </div>

  <nav id="navbar">
    <div class="nav-brand"><a href="#hero">OD.</a></div>
    <ul class="nav-links">
      <li><a href="#about">About & Skills</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#achievements">Achievements</a></li>
      <li><a href="#education">Education</a></li>
    </ul>
  </nav>

  <main id="main-content">
    
    <!-- HERO: Split Layout -->
    <header id="hero" class="section hero-split">
      <div class="hero-left">
        <h1 id="hero-name" class="display-text"></h1>
        <p id="hero-title" class="hero-subtitle"></p>
        <div class="hero-stats" id="hero-stats"></div>
        <div class="hero-actions">
          <a href="/cv.pdf" class="btn btn-primary" target="_blank">Download CV</a>
        </div>
      </div>
      <div class="hero-right">
        <div class="visual-mesh"></div>
      </div>
    </header>

    <!-- ABOUT + SKILLS: Bento Grid -->
    <section id="about" class="section bento-section reveal-section">
      <h2 id="about-heading" class="section-title">About & Skills</h2>
      <div class="bento-grid">
        <div class="bento-card card-bio glow-card">
          <p id="about-bio"></p>
        </div>
        <div class="bento-card card-focus glow-card">
          <h3 class="bento-header">Current Focus</h3>
          <p id="about-focus"></p>
        </div>
        <div class="bento-card card-lead glow-card" id="about-lead">
        </div>
        <div class="bento-card card-comm glow-card" id="about-comm">
        </div>
        <div class="bento-card card-skills glow-card" id="about-skills">
        </div>
      </div>
    </section>

    <!-- PROJECTS: Large Cards -->
    <section id="projects" class="section projects-section reveal-section">
      <h2 id="projects-heading" class="section-title">Projects</h2>
      <div id="projects-list" class="projects-list">
      </div>
    </section>

    <!-- EXPERIENCE: Vertical Split Timeline -->
    <section id="experience" class="section exp-section reveal-section">
      <h2 id="experience-heading" class="section-title">Experience</h2>
      <div id="experience-list" class="exp-timeline">
      </div>
    </section>

    <!-- ACHIEVEMENTS -->
    <section id="achievements" class="section achievements-section reveal-section">
      <h2 id="achievements-heading" class="section-title">Achievements</h2>
      <div id="achievements-list" class="projects-list">
      </div>
    </section>

    <!-- EDUCATION: Vertical Split Timeline -->
    <section id="education" class="section edu-section reveal-section">
      <h2 id="education-heading" class="section-title">Education</h2>
      <div id="education-list" class="exp-timeline">
      </div>
    </section>

    <!-- CONTACT: One Large CTA Block -->
    <section id="contact" class="section contact-section">
      <div class="cta-block glow-card">
        <h2 id="contact-heading" class="cta-title"></h2>
        <div id="contact-actions" class="cta-actions"></div>
      </div>
    </section>

  </main>
  
  <footer>
    <p>&copy; 2026 Orpita Das.</p>
  </footer>
  
  <script type="module" src="/main.js"></script>
</body>
</html>
